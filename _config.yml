# ─────────────────────────────────────────────────────────────
#  사이트 기본 설정
#  ▼ 아래 값들을 우리 기관 정보로 바꾸면 사이트 전체에 반영됩니다.
# ─────────────────────────────────────────────────────────────
title: 사회복지법인 가온
tagline: 꿈과 희망을 응원합니다
description: 장애인 직업재활 · 발달장애인 주간/방과후 활동 · 장애인 활동지원 서비스를 제공하는 사회복지법인입니다.
lang: ko

# GitHub Pages 배포 주소.
#   - username.github.io 저장소  → url: "https://username.github.io",  baseurl: ""
#   - 일반 저장소(project page)  → url: "https://username.github.io",  baseurl: "/저장소이름"
#   - 개인 도메인 연결           → url: "https://example.or.kr",        baseurl: ""
url: ""
baseurl: ""

# ── 기관 정보 (푸터 / 연락처 / 지도에 사용) ──────────────────
org:
  name: 사회복지법인 가온
  short_name: 가온
  ceo: 홍길동
  zipcode: "00000"
  address: OO도 OO시 OO읍 OO길 000
  tel: "000-0000-0000"
  fax: "000-0000-0000"
  email: example@example.com
  hours: 월~금 09:00 ~ 18:00 (주말 및 공휴일 휴무)
  copyright: Copyright 2026 사회복지법인 가온 All Rights Reserved.
  # 카카오/네이버 지도 임베드 주소 (없으면 비워두면 안내문구가 표시됩니다)
  map_embed: ""

# ── 관련 사이트 (푸터 셀렉트박스) ───────────────────────────
family_sites:
  - { name: 보건복지부, url: "https://www.mohw.go.kr" }
  - { name: 한국장애인개발원, url: "https://www.koddi.or.kr" }
  - { name: 사회복지시설정보시스템, url: "https://www.w4c.go.kr" }

# ── 게시판(컬렉션) ──────────────────────────────────────────
collections:
  notice:
    output: true
    permalink: /community/notice/:name/
  press:
    output: true
    permalink: /community/press/:name/
  dataroom:
    output: true
    permalink: /community/dataroom/:name/
  gallery:
    output: true
    permalink: /community/gallery/:name/

defaults:
  - scope: { path: "", type: notice }
    values: { layout: post, board: notice, board_title: 공지사항, board_url: /community/notice/ }
  - scope: { path: "", type: press }
    values: { layout: post, board: press, board_title: 언론보도자료, board_url: /community/press/ }
  - scope: { path: "", type: dataroom }
    values: { layout: post, board: dataroom, board_title: 자료실&소식지, board_url: /community/dataroom/ }
  - scope: { path: "", type: gallery }
    values: { layout: post, board: gallery, board_title: 포토게시판, board_url: /community/gallery/ }

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
