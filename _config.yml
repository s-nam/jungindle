# ─────────────────────────────────────────────────────────────
#  정인들 사회적협동조합 재가복지센터 - 사이트 설정
# ─────────────────────────────────────────────────────────────
title: 정인들 재가복지센터
tagline: 따뜻한 마음과 바른 가치를 실천하는
description: 세종특별자치시 재가노인복지시설. 방문요양 서비스와 노인장기요양등급 상담·신청을 지원합니다. 장기요양등급에 따라 85~100% 국가지원이 가능합니다.
lang: ko

# 사이트 주소.
#   url     : 도메인까지만. og:url, sitemap.xml 같은 절대주소 생성에 쓰입니다.
#   baseurl : 비워둘 것! 배포 워크플로가 GitHub Pages 설정을 읽어 자동으로 주입합니다.
#             (커스텀 도메인 → "", 커스텀 도메인 해제 시 → "/jungindle")
url: "https://jidcoop.com"
baseurl: ""

# ── 기관 정보 (헤더 / 푸터 / 모든 페이지에 반영) ─────────────
org:
  name: 정인들 사회적협동조합 재가복지센터
  full_name: 정인들 사회적협동조합
  short_name: 정인들
  branch: 재가복지센터
  slogan: 따뜻한 마음과 바른 가치를 실천하는
  category: 재가노인복지시설
  ceo_title: 대표 · 센터장
  ceo: 이정인
  zipcode: "30150"
  address: 세종특별자치시 한누리대로 2003, 702호 (소담동, 펠리체타워3)
  address_short: 세종 한누리대로 2003 펠리체타워3 702호
  address_hint: 소담동 세종상공회의소가 있는 건물입니다.
  tel: "044-865-7005"
  mobile: "010-3454-8984"
  fax: "044-865-8005"
  # 스팸봇 수집을 막기 위해 아이디와 도메인을 나눠 둡니다.
  # 화면에는 '아이디 + @모양 그림 + 도메인' 으로 조립되어 표시됩니다.
  # (합쳐진 주소가 HTML 소스에 남지 않습니다 - _includes/email.html 참고)
  email_user: jidcoop
  email_domain: naver.com
  hours: 월~금 09:00 ~ 18:00 (토·일 휴무)
  hours_short: 월~금 09:00~18:00
  closed: 토요일 · 일요일 · 공휴일 휴무
  naver_place: "https://naver.me/FLEnikGd"
  lat: "36.485444"
  lng: "127.30111"
  # 지도 삽입(iframe) 주소.
  #  ※ 네이버 지도는 여기에 넣을 수 없습니다.
  #     map.naver.com / naver.me 는 X-Frame-Options: DENY 로 외부 삽입을 차단합니다.
  #     (naver.me 링크는 '새 창으로 열기'용이며, 위 naver_place 에 이미 쓰고 있습니다)
  #     네이버 지도를 정말 넣으려면 네이버클라우드플랫폼 Maps 의 Client ID 가 필요합니다.
  #  ※ 비워두면 오시는 길 페이지에 주소와 '네이버 지도에서 보기' 버튼이 표시됩니다.
  map_embed: ""
  copyright: Copyright 2026 정인들 사회적협동조합 재가복지센터 All Rights Reserved.

# ── 관련 사이트 (푸터 셀렉트박스) ───────────────────────────
family_sites:
  - { name: 노인장기요양보험, url: "https://www.longtermcare.or.kr" }
  - { name: 국민건강보험공단, url: "https://www.nhis.or.kr" }
  - { name: 보건복지부, url: "https://www.mohw.go.kr" }
  - { name: 중앙치매센터, url: "https://www.nid.or.kr" }
  - { name: 세종특별자치시청, url: "https://www.sejong.go.kr" }

# ── 게시판(컬렉션) ──────────────────────────────────────────
collections:
  notice:
    output: true
    permalink: /community/notice/:name/
  dataroom:
    output: true
    permalink: /community/dataroom/:name/
  gallery:
    output: true
    permalink: /community/gallery/:name/

defaults:
  - scope: { path: "", type: notice }
    values: { layout: post, board: notice, board_title: 공지사항, board_url: /community/notice/ }
  - scope: { path: "", type: dataroom }
    values: { layout: post, board: dataroom, board_title: 자료실, board_url: /community/dataroom/ }
  - scope: { path: "", type: gallery }
    values: { layout: post, board: gallery, board_title: 포토게시판, board_url: /community/gallery/ }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
