<!-- 정人들 심볼: '정'(따뜻한 정情) + '人'(사람) + '들',
     골드 포인트는 희망과 미래를, 하단 곡선은 사람을 감싸 안는 품과 공동체의 연결을 뜻합니다. -->
<svg class="logo-mark" viewBox="0 0 220 108" role="img" aria-hidden="true" focusable="false">
  <path d="M16 32C12 88 62 102 110 102s98-14 94-70"
        fill="none" stroke="var(--blue)" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="110" cy="24" r="8" fill="var(--blue)"/>
  <text x="110" y="78" text-anchor="middle"
        font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"
        font-size="54" font-weight="800" letter-spacing="-1.5">
    <tspan fill="var(--blue)">정</tspan><tspan fill="var(--gold)">人</tspan><tspan fill="var(--blue)">들</tspan>
  </text>
</svg>
