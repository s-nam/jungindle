{%- comment -%}
  이메일 주소를 스팸봇이 긁어가지 못하게 조립해서 출력합니다.
  '@' 는 문자가 아니라 SVG 그림이라, 완성된 주소가 HTML 소스에 존재하지 않습니다.
  브라우저에서는 main.js 가 mailto 링크와 복사 버튼을 붙여줍니다.
  사용법:  {% include email.html %}
{%- endcomment -%}
